# Analysis configuration
# null degerler: o kural gercek veri gelene kadar atlanir

paths:
  raw_dir: "data/raw"
  interim_dir: "data/interim"

drive:
  folder_id: "1iDMZt3iUN-mHaemXXI_qNA9GkYUMf5t6"

experiment:
  practice_trials: 3
  measurement_trials: 50
  total_trials: 53
  rounds: 10
  conditions_per_round: 5
  conditions: ["no_noise", "N1", "N2", "N3", "N4"]
  trial_duration_s: 20.0
  reset_duration_s: 1.0
  sampling_rate_hz: 60
  samples_per_trial: 1200

physics:
  max_force_n: 4.0
  angle_limit_deg: 60.0
  track_limit_m: 5.0
  gravity: 1.0
  cart_mass_kg: 0.40
  pole_mass_kg: 0.08
  pole_length_m: 1.0
  # Dinamik denkleminde tam uzunluk degil yarim uzunluk giriyor.
  # Veriden dogrulandi (bkz. physics.verify_model): duzgun cubuk, 4/3 atalet.
  pole_half_length_m: 0.5
  inertia_coeff: 1.3333333333333333

t0:
  # T0 = kuvvetsiz serbest dususte fall limitine varma suresi
  integration_dt_s: 0.016666666666666666
  max_time_s: 60.0
  angle_round_decimals: 4

qc:
  dead_input_threshold: 0.0
  min_fps: null
  low_activity_threshold: null
  velocity_correlation_warn: 0.99
  dt_tolerance: 0.001
  # baslangic acisi RNG akisi karsilastirmasi
  angle_stream_tolerance_deg: 0.3
  angle_stream_min_overlap: 30
  angle_stream_match_rate: 0.9

build:
  # Park'in noturluk bandi. Girdi -1..1 normalize; orneklerin %73.5'i tam
  # sifir, sifir olmayan en kucuk deger ~0.015. Band pratikte "tam sifir".
  input_neutral_band: 0.02
  # Park footnote: banda takilip kalan I sayilir, joystick soldan saga
  # gecerken bandan hizli gecis I sayilmaz. Bu esikten kisa notr diziler
  # zit isaretli sapmalar arasindaysa X (gecici gecis) etiketlenir.
  neutral_transient_max_samples: 3
  regime_min_samples: 2

# GIRDI tarafinda tanimli olaylar (build.detect_input_events).
# Ludolph'un action timing event'leri DEGIL -- onlar durum tarafinda
# (pole tamsayi aciyi duserken geciyor), bkz. Yontem/05_Action_Timing.md.
input_events:
  # onset: notr banddan cikis, bu kadar ornek boyunca bandin disinda kalmali
  onset_min_samples: 3

metadata_required_fields:
  - participant_id
  - session_id
  - created_at
  - unity_version
  - gravity
  - cart_mass_kg
  - pole_mass_kg
  - pole_length_m
  - max_force_n
  - track_limit_m
  - angle_limit_deg
  - fixed_delta_time_s
  - config

metadata_requested_fields:
  - screen_width_px
  - screen_height_px
  - screen_physical_width_cm
  - viewing_distance_cm
  - refresh_rate_hz
  - full_screen
  - input_axis_name
  - deadzone
  - sensitivity
  - invert_axis
  - noise_texture_width_px
  - noise_texture_height_px
  - noise_update_rate_hz
  - noise_mean
  - noise_clipping_method
  - noise_monochrome_or_rgb
  - noise_overlay_opacity
  - balance_angle_limit_deg
  - balance_cart_limit_m
  - experiment_version
  - build_id
  - scene_name
  - operating_system
  - session_start_utc

performance:
  # NB03. Kayittaki within_bounds_time_s failure limitini (60 deg / 5 m)
  # kullaniyor ve her trial'da ~19.95 s cikiyor -- ayirt etmiyor. Kendi
  # esigimiz: |theta| <= bu deger sayilirsa "dengede".
  stab_angle_deg: 30.0
  trial_duration_s: 20.0          # payda; her measurement trial 1200 active sample
  baseline_condition: "no_noise"
  # sIQR gereksizlik testi (NB03 2). Iki kriterden biri yeterli:
  #  - katilimci ici korelasyon bu esigin ustunde (duz kopya), VEYA
  #  - kosul profilinin lineer kontrastinin bu kadarindan azi artikta
  #    kaliyor, yani noise trendini RMS zaten aciklamis.
  redundancy_abs_r: 0.9
  redundancy_retained_trend: 0.25

timing:
  # NB04, Ludolph action timing. Gerekceler: Yontem/05_Action_Timing.md
  # Olaya ortalanmis segmentin yari uzunlugu. Ludolph 1 s'lik pencere.
  segment_half_s: 0.5
  # Ludolph her tamsayi aciyi ayri olay sayiyor; biz merkez +- yariband
  # havuzluyoruz (tek acida ortalama egri bazen sifiri birden fazla
  # kesiyor, dar bant tek gecise dusuruyor).
  band_centers_deg: [5, 10, 15, 20]
  band_half_width_deg: 2
  # Ana analiz bandi. Digerleri saglamlik taramasi; aci sabitlenmeden
  # kosul/deneme karsilastirmasi yapilmaz (05 6: aci arasi fark yorumlanmaz).
  main_band_center_deg: 10
  # Ludolph bu kuantillerin disini atiyor; biz atmiyoruz, tabakaliyoruz.
  velocity_quantiles: [0.2, 0.8]
  # Action variability: sifir gecisi +- bu pencere icinde segmentler arasi sd
  variability_window_s: 0.06
  # Bir hucrede sifir gecisi aranmasi icin gereken en az segment
  min_segments: 30
  # Olcut ancak gercek bir yon degistirme varsa tanimli: ortalama egri
  # negatiften pozitife gecmeli VE genlik, ortalamanin standart hatasinin
  # bu kati kadar olmali. Yavas gecis tabakasinda egri duz kaliyor.
  min_amp_sem_ratio: 10
  # Ogrenme ekseni pencere genisligi (deneme). Ludolph'un 2 dk'si ~6 deneme.
  trial_window_size: 10
  bootstrap_n: 400

# --- Acil sunum notebook'u (90_sunum.ipynb) icin. Izole: baska hicbir
# notebook bu blogu okumaz, silinmesi zincirin geri kalanini etkilemez.
presentation:
  success_angle_deg: 30.0        # |theta| <= bu -> basarili dengeleme
  trial_duration_s: 20.0         # payda; her measurement trial tam 1200 active sample
  baseline_condition: "no_noise"
  # kisisel optimal composite'e giren metrikler (yonu net olanlar).
  # cart_rms disarida: dusuk cart salinimi "iyi kontrol" de olabilir
  # "hic mudahale etmedi" de -- yonu belirsiz, sadece incelemek icin.
  composite_metrics: ["mae_angle_deg", "success_time_s", "falls_per_trial"]
  figure_dir: "data/processed/sunum"
  figure_dpi: 200
  # Esik taramasi: "basarili dengeleme" tanimini degistirince sonuc
  # degisiyor mu. Ana figurler yine success_angle_deg ile cizilir.
  threshold_sweep_deg: [5, 10, 15, 20, 25, 30, 45]
  raw_dir_for_check: "data/raw"
