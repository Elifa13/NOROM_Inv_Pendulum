# Analysis configuration
# null degerler: o kural gercek veri gelene kadar atlanir

paths:
  raw_dir: "data/raw"
  interim_dir: "data/interim"

drive:
  folder_id: "1iDMZt3iUN-mHaemXXI_qNA9GkYUMf5t6"

experiment:
  practice_trials: 3
  measurement_trials: 50
  total_trials: 53
  rounds: 10
  conditions_per_round: 5
  conditions: ["no_noise", "N1", "N2", "N3", "N4"]
  trial_duration_s: 20.0
  reset_duration_s: 1.0
  sampling_rate_hz: 60
  samples_per_trial: 1200

physics:
  max_force_n: 4.0
  angle_limit_deg: 60.0
  track_limit_m: 5.0
  gravity: 1.0
  cart_mass_kg: 0.40
  pole_mass_kg: 0.08
  pole_length_m: 1.0
  # Dinamik denkleminde tam uzunluk degil yarim uzunluk giriyor.
  # Veriden dogrulandi (bkz. physics.verify_model): duzgun cubuk, 4/3 atalet.
  pole_half_length_m: 0.5
  inertia_coeff: 1.3333333333333333

t0:
  # T0 = kuvvetsiz serbest dususte fall limitine varma suresi
  integration_dt_s: 0.016666666666666666
  max_time_s: 60.0
  angle_round_decimals: 4

qc:
  dead_input_threshold: 0.0
  min_fps: null
  low_activity_threshold: null
  velocity_correlation_warn: 0.99
  dt_tolerance: 0.001
  # baslangic acisi RNG akisi karsilastirmasi
  angle_stream_tolerance_deg: 0.3
  angle_stream_min_overlap: 30
  angle_stream_match_rate: 0.9

build:
  # Park'in noturluk bandi. Girdi -1..1 normalize; orneklerin %73.5'i tam
  # sifir, sifir olmayan en kucuk deger ~0.015. Band pratikte "tam sifir".
  input_neutral_band: 0.02
  # Park footnote: banda takilip kalan I sayilir, joystick soldan saga
  # gecerken bandan hizli gecis I sayilmaz. Bu esikten kisa notr diziler
  # zit isaretli sapmalar arasindaysa X (gecici gecis) etiketlenir.
  neutral_transient_max_samples: 3
  regime_min_samples: 2

events:
  # onset: notr banddan cikis, bu kadar ornek boyunca bandin disinda kalmali
  onset_min_samples: 3

metadata_required_fields:
  - participant_id
  - session_id
  - created_at
  - unity_version
  - gravity
  - cart_mass_kg
  - pole_mass_kg
  - pole_length_m
  - max_force_n
  - track_limit_m
  - angle_limit_deg
  - fixed_delta_time_s
  - config

metadata_requested_fields:
  - screen_width_px
  - screen_height_px
  - screen_physical_width_cm
  - viewing_distance_cm
  - refresh_rate_hz
  - full_screen
  - input_axis_name
  - deadzone
  - sensitivity
  - invert_axis
  - noise_texture_width_px
  - noise_texture_height_px
  - noise_update_rate_hz
  - noise_mean
  - noise_clipping_method
  - noise_monochrome_or_rgb
  - noise_overlay_opacity
  - balance_angle_limit_deg
  - balance_cart_limit_m
  - experiment_version
  - build_id
  - scene_name
  - operating_system
  - session_start_utc

# --- Acil sunum notebook'u (90_sunum.ipynb) icin. Izole: baska hicbir
# notebook bu blogu okumaz, silinmesi zincirin geri kalanini etkilemez.
presentation:
  success_angle_deg: 30.0        # |theta| <= bu -> basarili dengeleme
  trial_duration_s: 20.0         # payda; her measurement trial tam 1200 active sample
  baseline_condition: "no_noise"
  # kisisel optimal composite'e giren metrikler (yonu net olanlar).
  # cart_rms disarida: dusuk cart salinimi "iyi kontrol" de olabilir
  # "hic mudahale etmedi" de -- yonu belirsiz, sadece incelemek icin.
  composite_metrics: ["mae_angle_deg", "success_time_s", "falls_per_trial"]
  figure_dir: "data/processed/sunum"
  figure_dpi: 200
  # Esik taramasi: "basarili dengeleme" tanimini degistirince sonuc
  # degisiyor mu. Ana figurler yine success_angle_deg ile cizilir.
  threshold_sweep_deg: [5, 10, 15, 20, 25, 30, 45]
  raw_dir_for_check: "data/raw"
